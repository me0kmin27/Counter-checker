<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>초기 관리자 설정</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth-page"><main class="auth-card"><h1>초기 관리자 설정</h1><p>첫 관리자 계정을 만듭니다. 이 화면은 한 번만 사용할 수 있습니다.</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post"><label>아이디<input name="username" required></label><label>표시 이름<input name="display_name" required></label><label>비밀번호 (10자 이상)<input type="password" name="password" minlength="10" required></label><button class="button primary">관리자 생성</button></form></main></body></html>
