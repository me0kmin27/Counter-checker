<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · Counter Checker</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="auth-page"><main class="auth-card"><a class="brand auth-brand" href="/login"><span>CC</span><b>Counter Checker</b></a><h1>로그인</h1><p>영업정보를 확인하려면 계정으로 로그인하세요.</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="next" value="{{ request.query_params.get('next', '/') }}"><label>아이디<input name="username" autocomplete="username" required autofocus></label><label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label><label>TOTP 인증 코드 <small>(등록한 경우)</small><input name="totp_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><button class="button primary">로그인</button></form></main></body></html>
